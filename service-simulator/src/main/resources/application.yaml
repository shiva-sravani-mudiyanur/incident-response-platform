spring:
  application:
    name: service-simulator
server:
  port: ${SERVER_PORT:8083}
  error:
    include-message: never
    include-stacktrace: never
management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,metrics,prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    info:
      access: read-only
    metrics:
      access: read-only
    prometheus:
      access: read-only
    health:
      access: read-only
      show-details: never
      show-components: never
logging:
  structured:
    format:
      console: logstash
simulator:
  event-service-base-url: ${EVENT_SERVICE_BASE_URL}
  failure-event-count: ${SIMULATOR_FAILURE_EVENT_COUNT:5}
  cascade-delay: ${SIMULATOR_CASCADE_DELAY:250ms}
  connect-timeout: ${SIMULATOR_CONNECT_TIMEOUT:2s}
  read-timeout: ${SIMULATOR_READ_TIMEOUT:15s}
