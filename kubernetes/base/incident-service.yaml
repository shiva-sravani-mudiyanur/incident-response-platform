apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-service
    spec:
      containers:
      - name: incident-service
        image: incident-response/incident-service:stage15
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: application-common
        env:
        - name: SERVER_PORT
          value: '8080'
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: '5432'
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: '6379'
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:19092
        - name: KAFKA_EVENTS_TOPIC
          value: service-events
        - name: KAFKA_CONSUMER_GROUP
          value: incident-processors
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: incident-database
              key: DB_USERNAME
              optional: false
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: incident-database
              key: DB_PASSWORD
              optional: false
        - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: 'true'
        - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
          value: readinessState,db,redis
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      initContainers:
      - name: wait-for-events-topic
        image: apache/kafka:4.1.2
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - |
          # Infrastructure owns topic creation; this is only a bounded readiness gate.
          printf 'request.timeout.ms=5000\ndefault.api.timeout.ms=5000\nretries=0\n' > /tmp/kafka-client.properties
          attempt=1
          while [ "$attempt" -le 120 ]; do
            if /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
                --command-config /tmp/kafka-client.properties \
                --describe --topic service-events; then
              exit 0
            fi
            echo "Waiting for existing service-events topic ($attempt/120)" >&2
            attempt=$((attempt + 1))
            if [ "$attempt" -le 120 ]; then sleep 5; fi
          done
          echo "Timed out waiting for infrastructure to create service-events" >&2
          exit 1
        env:
        - name: KAFKA_HEAP_OPTS
          value: -Xms32m -Xmx128m
        - name: LOG_DIR
          value: /tmp/kafka-logs
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: incident-service
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: incident-service
  ports:
  - name: http
    port: 8080
    targetPort: http
