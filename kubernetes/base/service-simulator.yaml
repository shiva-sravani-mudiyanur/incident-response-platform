apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-simulator
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: service-simulator
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: service-simulator
        image: incident-response/service-simulator:stage14
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8083
        envFrom:
        - configMapRef:
            name: application-common
        env:
        - name: SERVER_PORT
          value: '8083'
        - name: EVENT_SERVICE_BASE_URL
          value: http://event-service:8082
        - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: 'true'
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-simulator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service-simulator
  ports:
  - name: http
    port: 8083
    targetPort: http
