apiVersion: v1
kind: ConfigMap
metadata:
  name: application-common
data:
  SERVER_ADDRESS: 0.0.0.0
  DB_NAME: incident_response
  MANAGEMENT_ENDPOINTS_ACCESS_DEFAULT: none
  MANAGEMENT_ENDPOINT_HEALTH_ACCESS: read-only
  MANAGEMENT_ENDPOINT_INFO_ACCESS: read-only
  MANAGEMENT_ENDPOINT_METRICS_ACCESS: read-only
  MANAGEMENT_ENDPOINT_PROMETHEUS_ACCESS: read-only
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
  MANAGEMENT_ENDPOINTS_WEB_DISCOVERY_ENABLED: 'false'
  MANAGEMENT_ENDPOINTS_JMX_EXPOSURE_EXCLUDE: '*'
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: never
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_LIVENESS_INCLUDE: livenessState
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState
