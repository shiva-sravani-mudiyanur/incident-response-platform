apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analysis-service
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: ai-analysis-service
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: ai-analysis-service
        image: incident-response/ai-analysis-service:stage14
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8085
        envFrom:
        - configMapRef:
            name: application-common
        - configMapRef:
            name: analysis-config
        env:
        - name: SERVER_PORT
          value: '8085'
        - name: DIAGNOSTICS_MCP_BASE_URL
          value: http://diagnostics-mcp-server:8084
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: analysis-provider
              key: OPENAI_API_KEY
              optional: false
        - name: OPENAI_MODEL
          valueFrom:
            secretKeyRef:
              name: analysis-provider
              key: OPENAI_MODEL
              optional: false
        # Override the source YAML's legacy placeholder at the actual Spring property.
        - name: SPRING_AI_OPENAI_CHAT_API_KEY
          valueFrom:
            secretKeyRef:
              name: analysis-provider
              key: OPENAI_API_KEY
              optional: false
        - name: SPRING_AI_OPENAI_CHAT_BASE_URL
          valueFrom:
            secretKeyRef:
              name: analysis-provider
              key: SPRING_AI_OPENAI_CHAT_BASE_URL
              optional: true
        - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: 'true'
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analysis-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-analysis-service
  ports:
  - name: http
    port: 8085
    targetPort: http
