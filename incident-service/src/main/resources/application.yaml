spring:
  main:
    banner-mode: "off"
  application:
    name: incident-service
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 3s
      timeout: 3s
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      auto-create: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:incident-processors}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      missing-topics-fatal: true
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,metrics,prometheus
    jmx:
      exposure:
        exclude: '*'
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
    info:
      access: read-only
    metrics:
      access: read-only
    prometheus:
      access: read-only
  info:
    defaults:
      enabled: false
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        application: ${spring.application.name}
app:
  kafka:
    topic: ${KAFKA_EVENTS_TOPIC:service-events}
    retry-interval: ${KAFKA_RETRY_INTERVAL:1s}
incident:
  health:
    degraded-threshold: ${INCIDENT_HEALTH_DEGRADED_THRESHOLD:2}
    down-threshold: ${INCIDENT_HEALTH_DOWN_THRESHOLD:5}
  correlation:
    threshold: ${INCIDENT_CORRELATION_THRESHOLD:5}
    window-seconds: ${INCIDENT_CORRELATION_WINDOW_SECONDS:60}
