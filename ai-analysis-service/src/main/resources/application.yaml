spring:
  application:
    name: ai-analysis-service
  cloud:
    circuitbreaker:
      bulkhead:
        resilience4j:
          enabled: false
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    model:
      chat: openai
    openai:
      chat:
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_MODEL}
        timeout: ${OPENAI_REQUEST_TIMEOUT:60s}
        max-retries: 0
        max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:2048}
        store: false
    mcp:
      client:
        # The scoped SDK client is created lazily per analysis, not auto-imported globally.
        enabled: false
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,metrics,prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
    info:
      access: read-only
    metrics:
      access: read-only
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: logstash
analysis:
  resilience:
    operation-timeout: ${ANALYSIS_RESILIENCE_OPERATION_TIMEOUT:20s}
    max-attempts: ${ANALYSIS_RESILIENCE_MAX_ATTEMPTS:2}
    retry-delay: ${ANALYSIS_RESILIENCE_RETRY_DELAY:100ms}
    sliding-window-size: ${ANALYSIS_RESILIENCE_SLIDING_WINDOW_SIZE:10}
    minimum-number-of-calls: ${ANALYSIS_RESILIENCE_MINIMUM_NUMBER_OF_CALLS:5}
    failure-rate-threshold: ${ANALYSIS_RESILIENCE_FAILURE_RATE_THRESHOLD:50}
    wait-duration-in-open-state: ${ANALYSIS_RESILIENCE_WAIT_DURATION_IN_OPEN_STATE:10s}
    permitted-calls-in-half-open-state: ${ANALYSIS_RESILIENCE_PERMITTED_CALLS_IN_HALF_OPEN_STATE:1}
    max-concurrent-calls: ${ANALYSIS_RESILIENCE_MAX_CONCURRENT_CALLS:4}
  diagnostics-mcp-base-url: ${DIAGNOSTICS_MCP_BASE_URL}
  mcp-connect-timeout: ${ANALYSIS_MCP_CONNECT_TIMEOUT:3s}
  mcp-request-timeout: ${ANALYSIS_MCP_REQUEST_TIMEOUT:15s}
  max-model-rounds: ${ANALYSIS_MAX_MODEL_ROUNDS:3}
  max-tool-calls: ${ANALYSIS_MAX_TOOL_CALLS:8}
  max-evidence-characters: ${ANALYSIS_MAX_EVIDENCE_CHARACTERS:64000}
  max-model-response-characters: ${ANALYSIS_MAX_MODEL_RESPONSE_CHARACTERS:16000}
