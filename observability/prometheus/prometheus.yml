# Spring Boot services expose their own application/JVM/HTTP metrics.
# Use container DNS and internal ports, never the host's published ports.
# Prometheus is pull-based: it scrapes; the applications do not push metrics.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: incident-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['incident-service:8080']
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8081']
  - job_name: event-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['event-service:8082']
  - job_name: service-simulator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['service-simulator:8083']
  - job_name: diagnostics-mcp-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['diagnostics-mcp-server:8084']
  - job_name: ai-analysis-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ai-analysis-service:8085']
