spring:
  application:
    name: event-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      auto-create: false
    producer:
      acks: all
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  kafka:
    topic: ${KAFKA_EVENTS_TOPIC:service-events}
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:5s}
