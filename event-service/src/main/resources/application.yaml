spring:
  application:
    name: event-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      auto-create: false
    producer:
      acks: all
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info,metrics,prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
    info:
      access: read-only
    metrics:
      access: read-only
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: logstash
app:
  kafka:
    topic: ${KAFKA_EVENTS_TOPIC:service-events}
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:5s}
